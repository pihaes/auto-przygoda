<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoPrzygoda</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: #f0f8ff;
    }
    h1 {
      color: #5e3c99;
      text-shadow: 1px 1px 2px #c4a3ff;
    }
    #map {
      height: 60vh;
      width: 100%;
      z-index: 1;
      background: #ccc;
      border: 4px dashed #a985ff;
    }
    .question-container {
      padding: 20px;
      background: #fff0f5;
      animation: fadeIn 0.5s ease-in-out;
      border-radius: 16px;
      margin: 16px;
      box-shadow: 0 0 12px rgba(173, 128, 255, 0.3);
    }
    button {
      margin-top: 10px;
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background-color: #ff69b4;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:hover {
      background-color: #ff1493;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1 style="text-align:center; padding: 10px">AutoPrzygoda – Twoja podróż przez Polskę</h1>
  <div id="map"></div>

  <div id="zagadka" class="question-container" style="display:none;">
    <h3>Co to za budowla: Ma wieże, mury i często duchy?</h3>
    <button>Zamek</button>
    <button>Kościół</button>
    <button>Sklep</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const map = L.map('map').setView([50.7, 18.5], 7);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
      }).addTo(map);

      const miejsca = [
        {
          nazwa: "Stary Zamek",
          wspolrzedne: [51.1079, 17.0385],
          pytanie: "Co to za budowla: Ma wieże, mury i często duchy?",
          poprawna: "Zamek"
        },
        {
          nazwa: "Smocza Jama",
          wspolrzedne: [50.054, 19.936],
          pytanie: "W której jaskini w Krakowie mieszkał smok?",
          poprawna: "Smocza Jama"
        },
        {
          nazwa: "Jezioro Goczałkowickie",
          wspolrzedne: [49.938, 18.811],
          pytanie: "Jak nazywa się duży zbiornik wodny niedaleko Bielska-Białej?",
          poprawna: "Jezioro Goczałkowickie"
        },
        {
          nazwa: "Lasy koło Opola",
          wspolrzedne: [50.675, 17.906],
          pytanie: "Co porasta duży obszar między Opolem a Kluczborkiem?",
          poprawna: "Lasy"
        },
        {
          nazwa: "Kopalnia Guido",
          wspolrzedne: [50.293, 18.787],
          pytanie: "Jak nazywa się znana zabytkowa kopalnia w Zabrzu?",
          poprawna: "Kopalnia Guido"
        }
      ];

      miejsca.forEach(miejsce => {
        const marker = L.marker(miejsce.wspolrzedne).addTo(map);
        marker.bindPopup(`<b>${miejsce.nazwa}</b><br>Kliknij, by rozwiązać zagadkę!`).on('click', () => {
          pokazZagadke(miejsce.pytanie, miejsce.poprawna);
        });
      });

      // Rysowanie trasy przerywaną linią
      const punktyTrasy = miejsca.map(m => m.wspolrzedne);
      const trasa = L.polyline(punktyTrasy, {
        color: 'purple',
        weight: 4,
        opacity: 0.7,
        dashArray: '10,10'
      }).addTo(map);

      function pokazZagadke(pytanie, poprawna) {
        const zagadkaDiv = document.getElementById('zagadka');
        zagadkaDiv.style.display = 'block';
        zagadkaDiv.classList.remove('fade');
        void zagadkaDiv.offsetWidth;
        zagadkaDiv.classList.add('fade');
        document.querySelector('#zagadka h3').textContent = pytanie;
        document.querySelectorAll('#zagadka button').forEach(btn => {
          btn.onclick = () => sprawdzOdpowiedz(btn.textContent, poprawna);
        });
      }

      function sprawdzOdpowiedz(odpowiedz, poprawna) {
        if (odpowiedz === poprawna) {
          alert('Brawo! To poprawna odpowiedź.');
        } else {
          alert('Nie tym razem. Spróbuj jeszcze raz!');
        }
      }

      setTimeout(() => {
        map.invalidateSize();
      }, 100);
    });
  </script>
</body>
</html>
