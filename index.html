<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoPrzygoda</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: #fef6e4;
    }
    h1 {
      text-align: center;
      padding: 16px;
      color: #663399;
      background: #ffcad4;
      margin: 0;
    }
    .map-placeholder {
      height: 60vh;
      background: url('https://cdn.pixabay.com/photo/2014/04/03/10/32/map-311333_1280.png') center center no-repeat;
      background-size: contain;
      border: 6px dashed #ffaec0;
      margin: 16px;
      border-radius: 16px;
    }
    .question-container {
      padding: 20px;
      background: #fff0f5;
      animation: fadeIn 0.5s ease-in-out;
      border-radius: 16px;
      margin: 16px;
      box-shadow: 0 0 12px rgba(173, 128, 255, 0.3);
    }
    button {
      margin: 6px;
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background-color: #ff69b4;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:hover {
      background-color: #ff1493;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>AutoPrzygoda – Twoja bajkowa podróż przez Polskę</h1>
  <div class="map-placeholder"></div>

  <div id="zagadka" class="question-container">
    <h3 id="pytanie">Jak nazywa się znana zabytkowa kopalnia w Zabrzu?</h3>
    <div id="odpowiedzi">
      <button onclick="sprawdzOdpowiedz(this.innerText)">Kopalnia Guido</button>
      <button onclick="sprawdzOdpowiedz(this.innerText)">Wieliczka</button>
      <button onclick="sprawdzOdpowiedz(this.innerText)">Złoty Stok</button>
    </div>
    <br>
    <button onclick="nastepnaZagadka()">➡️ Następna zagadka</button>
  </div>

  <script>
    const zagadki = [
      {
        pytanie: "Jak nazywa się znana zabytkowa kopalnia w Zabrzu?",
        poprawna: "Kopalnia Guido",
        odpowiedzi: ["Kopalnia Guido", "Wieliczka", "Złoty Stok"]
      },
      {
        pytanie: "Jak nazywa się duże jezioro na Śląsku?",
        poprawna: "Jezioro Goczałkowickie",
        odpowiedzi: ["Jezioro Czorsztyńskie", "Jezioro Goczałkowickie", "Jezioro Zegrzyńskie"]
      },
      {
        pytanie: "Co porasta obszary między Opolem a Kluczborkiem?",
        poprawna: "Lasy",
        odpowiedzi: ["Pustynie", "Lasy", "Bagna"]
      }
    ];

    let index = 0;

    function pokazZagadka() {
      const z = zagadki[index];
      document.getElementById("pytanie").innerText = z.pytanie;
      const kontener = document.getElementById("odpowiedzi");
      kontener.innerHTML = "";
      z.odpowiedzi.forEach(o => {
        const btn = document.createElement("button");
        btn.innerText = o;
        btn.onclick = () => sprawdzOdpowiedz(o);
        kontener.appendChild(btn);
      });
    }

    function sprawdzOdpowiedz(odp) {
      if (odp === zagadki[index].poprawna) {
        alert("Brawo! To poprawna odpowiedź.");
      } else {
        alert("Nie tym razem. Spróbuj jeszcze raz!");
      }
    }

    function nastepnaZagadka() {
      index = (index + 1) % zagadki.length;
      pokazZagadka();
    }

    document.addEventListener("DOMContentLoaded", pokazZagadka);
  </script>
</body>
</html>
